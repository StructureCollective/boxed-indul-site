<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Boxed Indulgence</title>

<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Boxed Indulgence">
<meta property="og:title" content="Contact — Boxed Indulgence">
<meta property="og:description" content="Ask a question or get a custom quote for indulgent, hand-curated boxed catered meals.">
<meta property="og:image" content="https://boxedindulgence.com/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://boxedindulgence.com/contact/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Contact — Boxed Indulgence">
<meta name="twitter:description" content="Ask a question or get a custom quote for indulgent, hand-curated boxed catered meals.">
<meta name="twitter:image" content="https://boxedindulgence.com/img/og-image.jpg">

<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">
      <img src="/img/logo.png" alt="Boxed Indulgence logo">
      <span>Boxed <em>Indulgence</em></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/#menus">Boxed Meals</a></li>
        <li><a href="/#testimonials">Testimonials</a></li>
        <li><a href="/booking/">Order Now</a></li>
        <li><a href="/contact/" class="active">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="section-head">
      <p class="eyebrow">Get In Touch</p>
      <h2>Ask a Question or Get a Quote</h2>
      <p>Not ready to check dates yet? Send the details and we'll follow up with a custom quote.</p>
    </div>

    <form class="form-card" id="contactForm">
      <div class="field-row">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
        </div>
        <div class="field">
          <label for="guest_count">Number of boxes</label>
          <input type="number" id="guest_count" name="guest_count" min="1">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="event_date">Preferred delivery date (if known)</label>
          <input type="date" id="event_date" name="event_date">
        </div>
        <div class="field">
          <label for="budget">Approximate budget</label>
          <input type="text" id="budget" name="budget" placeholder="e.g. $500–$1,000">
        </div>
      </div>

      <div class="field">
        <label for="location">Delivery or pickup location</label>
        <input type="text" id="location" name="location" placeholder="Address or venue name">
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us about your order…" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;justify-content:center;">Send Message</button>
      <div class="form-msg" id="formMsg"></div>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      © <span id="year"></span> Boxed Indulgence. Mockup site.
      <span class="footer-credit">Built by <a href="https://structurecollective.com" target="_blank" rel="noopener"><img src="/img/sc-logo.png" alt="" class="sc-logo">Structure Collective</a></span>
    </div>
  </div>
</footer>

<script src="/js/main.js"></script>
<script src="/js/mock-db.js"></script>
<script src="/js/contact.js"></script>
</body>
</html>
